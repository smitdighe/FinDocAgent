[project]
name = "findoc-backend"
version = "0.1.0"
description = "FinDocAgent backend: multi-agent RAG over SEC filings with table-aware, verified, cited answers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi>=0.139,<1",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14",
    # db
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "alembic>=1.18",
    "asyncpg>=0.31",
    "pgvector>=0.4.2",
    # http / ingestion
    "httpx>=0.28",
    "tenacity>=9.1",
    "playwright>=1.61",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.11",
    "pillow>=12",
    "lxml>=5.3",
    # embedding (query-time on server, batch locally)
    "numpy>=2.0",
    "torch>=2.9",
    "colpali-engine>=0.3.17,<0.4",
    # agents / llm (wired in phases 2-3; pinned now so the lockfile is stable)
    "langgraph>=1.2,<2",
    "groq>=1.5",
    "openai>=2.44",
    # observability (phase 5)
    "langfuse>=4.13,<5",
]
# NOTE: ragas is added in phase 4 (eval harness) — it drags a large dependency
# tree and is not needed until the harness lands.

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.1",
    "ruff>=0.15",
    "lxml-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Force CPU-only torch wheels on linux (Render / Docker). Windows/macOS PyPI
# wheels are already CPU-only. For a local CUDA box, override with:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu126
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
exclude = ["app/db/migrations/"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pypdfium2.*",
    "colpali_engine.*",
    "pgvector.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit a browser, DB, or network (RUN_INTEGRATION=1)",
]
